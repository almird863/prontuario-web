<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pagina-login">

  <main class="login">
    <h1 class="login__titulo">Entrar no prontuário</h1>
    <p class="login__texto">Use o e-mail e a senha cadastrados.</p>

    <!-- method="post": se o JavaScript falhar, os dados nunca vão para a URL -->
    <form id="form-login" class="form" method="post" novalidate>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="username" required autofocus>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo__senha">
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
          <button type="button" class="botao botao--texto" id="alternar-senha" aria-controls="senha" aria-pressed="false">
            Mostrar
          </button>
        </div>
      </div>

      <!-- Erros do login (senha incorreta, servidor fora do ar etc.) -->
      <p class="form__erro" id="erro-geral" role="alert" hidden></p>

      <button type="submit" class="botao botao--primario botao--cheio" id="botao-entrar">
        Entrar
      </button>
    </form>

    <div class="login__cadastro">
      <p>Ainda não tem conta?</p>
      <a href="cadastro.html" class="botao botao--cheio">Criar conta</a>
    </div>

    <p class="login__rodape">
      Seus dados e os de seus pacientes são protegidos pela LGPD.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../javascript/api.js"></script>
  <script src="../javascript/ui.js"></script>
  <script src="../javascript/login.js"></script>
</body>
</html>
